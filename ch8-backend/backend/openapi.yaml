openapi: 3.1.0
info:
  title: 家計簿API
  version: 1.0.0
  description: 取引履歴の取得・登録を行うAPI

servers:
  - url: http://localhost:3000
    description: ローカル開発サーバ

paths:
  /transactions:
    get:
      summary: 取引履歴一覧の取得
      operationId: getTransactions
      parameters:
        - name: type
          in: query
          required: true
          description: 取引種別フィルタ
          schema:
            type: string
            enum:
              - income
              - expense
              - all
      responses:
        "200":
          description: 取引履歴一覧
          content:
            application/json:
              schema:
                type: object
                required:
                  - transactions
                  - totalCount
                  - totalAmount
                properties:
                  transactions:
                    type: array
                    items:
                      $ref: "#/components/schemas/Transaction"
                  totalCount:
                    type: integer
                    description: 総取引数
                    examples:
                      - 2
                  totalAmount:
                    type: integer
                    description: 合計金額
                    examples:
                      - 90000
        "400":
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

    post:
      summary: 取引情報の登録
      operationId: createTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - item
                - amount
                - date
              properties:
                item:
                  type: string
                  description: 取引項目名
                  examples:
                    - 給料
                amount:
                  type: integer
                  description: 金額（0以外の数値。収入は正、支出は負）
                  examples:
                    - 100000
                date:
                  type: string
                  pattern: ^\d{4}-\d{2}-\d{2}$
                  description: 取引日（YYYY-MM-DD形式）
                  examples:
                    - "2025-01-01"
      responses:
        "201":
          description: 登録成功
          content:
            application/json:
              schema:
                type: object
                properties:
                  item:
                    type: string
                  amount:
                    type: integer
                  date:
                    type: string
        "400":
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Transaction:
      type: object
      required:
        - id
        - item
        - amount
        - date
      properties:
        id:
          type: integer
          description: 取引ID
          examples:
            - 1
        item:
          type: string
          description: 取引項目名
          examples:
            - 給料
        amount:
          type: integer
          description: 金額
          examples:
            - 100000
        date:
          type: string
          description: 取引日（YYYY-MM-DD形式）
          examples:
            - "2025-01-01"

    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: エラーメッセージ
