<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>シンプル家計簿アプリ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="header__title">シンプル家計簿</h1>
      <nav class="header__nav">
        <ul class="header__nav-list">
          <li class="header__nav-item"><a href="index.html" class="header__nav-link">ホーム</a></li>
          <li class="header__nav-item"><a href="input.html" class="header__nav-link">収支登録</a></li>
        </ul>
      </nav>
    </header>
    
    <main class="main">
      <div class="container">
        <div class="summary">
          <div class="summary__item summary__item--income">
            <h2 class="summary__title">収入合計</h2>
            <p class="summary__amount" id="total-income">0円</p>
          </div>
          <div class="summary__item summary__item--expense">
            <h2 class="summary__title">支出合計</h2>
            <p class="summary__amount" id="total-expense">0円</p>
          </div>
          <div class="summary__item summary__item--balance">
            <h2 class="summary__title">残高</h2>
            <p class="summary__amount" id="balance">0円</p>
          </div>
        </div>

        <div class="button-group">
          <a href="input.html" class="button button--primary">収支を登録する</a>
        </div>

        <div class="history">
          <div class="history__section">
            <h2 class="history__title">収入履歴</h2>
            <div id="income-history" class="history__list">
              <!-- 収入履歴がここに表示されます -->
            </div>
          </div>
          <div class="history__section">
            <h2 class="history__title">支出履歴</h2>
            <div id="expense-history" class="history__list">
              <!-- 支出履歴がここに表示されます -->
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="footer">
      <p class="footer__text">© 2025 シンプル家計簿</p>
    </footer>

    <script src="common.js"></script>
    <script src="index.js"></script>
  </body>
</html>
