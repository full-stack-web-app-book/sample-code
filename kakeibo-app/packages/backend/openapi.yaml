openapi: 3.0.0
info:
  title: 家計簿アプリ API
  description: 収入合計、支出合計、残高を管理するための API
  version: 1.0.0
servers:
  - url: /
    description: 開発サーバー
paths:
  /summary:
    get:
      summary: 家計簿サマリーの取得
      description: 収入合計、支出合計、残高を取得します
      responses:
        "200":
          description: 正常にデータを取得
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FinancialSummary"
              example:
                totalIncome: 300000
                totalExpense: -25000
                balance: 275000
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /transactions:
    get:
      summary: 取引履歴一覧の取得
      description: すべての取引履歴の一覧を取得します。typeクエリパラメータで収入または支出をフィルタリングできます
      parameters:
        - name: type
          in: query
          description: 取引種別でフィルタリング（income - 正の金額、expense - マイナス金額）
          required: false
          schema:
            type: string
            enum: [income, expense]
          example: income
      responses:
        "200":
          description: 正常にデータを取得
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionList"
              examples:
                all_transactions:
                  summary: 全取引の場合
                  value:
                    transactions:
                      - id: 1654321234567
                        item: 給料
                        amount: 250000
                        date: "2025-05-25"
                      - id: 1654321234568
                        item: 副業収入
                        amount: 50000
                        date: "2025-05-20"
                      - id: 1654321234569
                        item: 食費
                        amount: -3000
                        date: "2025-05-26"
                      - id: 1654321234570
                        item: 交通費
                        amount: -1500
                        date: "2025-05-27"
                    totalCount: 4
                    totalAmount: 295500
                income_only:
                  summary: 収入のみ（type=income）の場合
                  value:
                    transactions:
                      - id: 1654321234567
                        item: 給料
                        amount: 250000
                        date: "2025-05-25"
                      - id: 1654321234568
                        item: 副業収入
                        amount: 50000
                        date: "2025-05-20"
                    totalCount: 2
                    totalAmount: 300000
                expense_only:
                  summary: 支出のみ（type=expense）の場合
                  value:
                    transactions:
                      - id: 1654321234569
                        item: 食費
                        amount: -3000
                        date: "2025-05-26"
                      - id: 1654321234570
                        item: 交通費
                        amount: -1500
                        date: "2025-05-27"
                    totalCount: 2
                    totalAmount: -4500
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      summary: 取引情報の登録
      description: 新しい取引情報を登録します。金額が正の値なら収入、マイナス値なら支出として扱われます
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionInput"
            example:
              item: 給料
              amount: 250000
              date: "2025-05-25"
      responses:
        "201":
          description: 取引情報の登録成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Transaction"
              example:
                id: 1654321234567
                item: 給料
                amount: 250000
                date: "2025-05-25"
        "400":
          description: 不正なリクエスト
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    FinancialSummary:
      type: object
      required:
        - totalIncome
        - totalExpense
        - balance
      properties:
        totalIncome:
          type: number
          description: 収入合計
          example: 300000
        totalExpense:
          type: number
          description: 支出合計（マイナス値）
          example: -25000
        balance:
          type: number
          description: 残高（収入合計 + 支出合計）
          example: 275000

    Transaction:
      type: object
      required:
        - id
        - item
        - amount
        - date
      properties:
        id:
          type: integer
          description: 取引ID
          example: 1654321234567
        item:
          type: string
          description: 項目名
          example: 給料
        amount:
          type: number
          description: 金額（収入の場合は正の値、支出の場合はマイナス値）
          example: 250000
        date:
          type: string
          format: date
          description: 取引日付
          example: "2025-05-25"

    TransactionList:
      type: object
      required:
        - transactions
        - totalCount
      properties:
        transactions:
          type: array
          description: 取引リスト
          items:
            $ref: "#/components/schemas/Transaction"
          example:
            - id: 1654321234567
              item: 給料
              amount: 250000
              date: "2025-05-25"
            - id: 1654321234568
              item: 副業収入
              amount: 50000
              date: "2025-05-20"
        totalCount:
          type: integer
          description: 総取引数
          example: 2
        totalAmount:
          type: number
          description: 合計金額
          example: 300000

    Error:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          description: エラーメッセージ
          example: "エラーが発生しました"

    TransactionInput:
      type: object
      required:
        - item
        - amount
        - date
      properties:
        item:
          type: string
          description: 項目名
          example: 給料
        amount:
          type: number
          description: 金額（正の値は収入、マイナス値は支出として扱われます）
          example: 250000
        date:
          type: string
          format: date
          description: 取引日付
          example: "2025-05-25"
