<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>収支の登録 - シンプル家計簿アプリ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <h1 class="page-title">収支の登録</h1>

      <form id="transaction-form" class="form">
        <div class="form__group">
          <label class="form__label">種類：</label>
          <div class="form__radio-group">
            <label class="form__radio-label">
              <input type="radio" name="type" value="income" checked class="form__radio-input" /> 収入
            </label>
            <label class="form__radio-label">
              <input type="radio" name="type" value="expense" class="form__radio-input" /> 支出
            </label>
          </div>
        </div>

        <div class="form__group">
          <label for="item" class="form__label">項目：</label>
          <input
            type="text"
            id="item"
            name="item"
            placeholder="例：給料、食費、交通費など"
            required
            class="form__input"
          />
        </div>

        <div class="form__group">
          <label for="amount" class="form__label">金額（円）：</label>
          <input
            type="number"
            id="amount"
            name="amount"
            min="1"
            placeholder="例：10000"
            required
            class="form__input"
          />
        </div>

        <div class="form__group">
          <label for="date" class="form__label">日付：</label>
          <input type="date" id="date" name="date" required class="form__input" />
        </div>

        <div class="button-group">
          <button type="submit" id="submit-btn" class="button button--primary">
            登録する
          </button>
          <a href="index.html" class="button button--secondary">キャンセル</a>
        </div>
      </form>
    </div>

    <script src="common.js"></script>
    <script src="input.js"></script>
  </body>
</html>
