version: "3.8"

services:
  postgres:
    image: postgres:latest
    container_name: kakeibo-postgres
    environment:
      POSTGRES_USER: kakeibo_user
      POSTGRES_PASSWORD: kakeibo_password
      POSTGRES_DB: kakeibo_db
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
